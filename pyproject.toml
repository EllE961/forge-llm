[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-llm"
version = "0.1.0"
description = "A Llama-style language model built from first principles: BPE tokenizer, pretraining, KV-cache & speculative decoding, LoRA, and an interactive playground."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "torch>=1.13",
  "numpy>=1.24",
  "regex>=2023.0",
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "matplotlib>=3.7",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24", "ruff>=0.1", "tiktoken>=0.5"]

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E731", "B905", "SIM108", "UP007"]
exclude = ["data", "checkpoints", "runs"]

[tool.ruff.per-file-ignores]
"tests/*" = ["B018"]
